<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TE-Rhythm // PRO_CORE.v18</title>
    <style>
        :root {
            --bg-device: #e0e0e0;
            --screen-bg: #050505;
            --accent-orange: #ff5f00;
            --accent-fever: #00f2ff;
            --button-depth: #bcbcbc;
        }
        body {
            margin: 0;
            background-color: var(--bg-device);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }
        #hardware-ui {
            background: var(--bg-device);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #d1d1d1;
            width: 480px;
            max-width: 95vw;
            box-sizing: border-box;
        }
        header { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 10px; }
        .label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #888; }
        
        #screen-container {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 14px;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.6);
            position: relative;
            height: 520px;
            overflow: hidden;
        }
        canvas { display: block; background-color: var(--screen-bg); border-radius: 4px; width: 100%; height: 500px; }

        #overlay {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 30px;
            background: var(--screen-bg);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            border-radius: 4px;
        }
        .menu-title { font-size: 24px; font-weight: 900; letter-spacing: -1px; margin-bottom: 30px; color: var(--accent-orange); }
        .menu-btn {
            background: transparent;
            border: 1px solid #444;
            color: white;
            padding: 12px 30px;
            margin: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            width: 220px;
            text-transform: uppercase;
        }
        .menu-btn:hover:not(:disabled) { border-color: var(--accent-orange); color: var(--accent-orange); }
        .menu-btn:disabled { color: #333; border-color: #222; cursor: not-allowed; }

        .stat-line { display: flex; justify-content: space-between; width: 220px; margin: 5px 0; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .stat-label { font-size: 10px; color: #666; text-transform: uppercase; }
        .stat-val { font-family: 'Courier New', monospace; font-weight: bold; color: var(--accent-orange); }

        #progress-wrapper { width: 100%; height: 4px; background: #333; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--accent-orange); transition: background 0.3s; }
        #progress-fill.fever { background: var(--accent-fever); box-shadow: 0 0 10px var(--accent-fever); }

        #controls { display: flex; justify-content: space-between; align-items: center; }

        .custom-file-upload {
            background: #dcdcdc;
            border: 1px solid var(--button-depth);
            border-bottom: 3px solid var(--button-depth);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .custom-file-upload:active { border-bottom-width: 1px; transform: translateY(2px); }
        input[type="file"] { display: none; }

        .diff-btn {
            background: #dcdcdc;
            border: 1px solid #bcbcbc;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
        }
        .diff-btn.active { background: var(--accent-orange); color: white; border: none; }

        .readout-box {
            font-family: 'Courier New', monospace;
            background: #dcdcdc;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #bcbcbc;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="hardware-ui">
        <header>
            <div>
                <div class="label">System OS</div>
                <div style="font-weight: 900; font-size: 14px; margin-bottom: 5px;" id="ver-label">SYNC_CORE.v18</div>
                <div id="difficulty-switches">
                    <button class="diff-btn active" onclick="setDifficulty('easy')">EASY</button>
                    <button class="diff-btn" onclick="setDifficulty('normal')">NORM</button>
                    <button class="diff-btn" onclick="setDifficulty('hard')">HARD</button>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div>
                    <div class="label">Streak</div>
                    <div class="readout-box" id="streak-count" style="font-size: 18px; font-weight: bold;">00</div>
                </div>
                <div>
                    <div class="label">Score</div>
                    <div class="readout-box" id="score-readout" style="font-size: 18px; font-weight: bold;">0000</div>
                </div>
            </div>
        </header>

        <div id="screen-container">
            <div id="overlay"></div>
            <canvas id="gameCanvas" width="400" height="500"></canvas>
            <div id="progress-wrapper"><div id="progress-fill"></div></div>
        </div>

        <div id="controls">
            <label class="custom-file-upload">
                <input type="file" id="audio-upload" accept="audio/*">
                <span>LOAD_DATA</span>
            </label>
            <div style="text-align: right;">
                <div class="label">Module Status</div>
                <div style="font-size: 11px; font-weight: bold;" id="status-text">SYSTEM_READY</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const audioUpload = document.getElementById('audio-upload');
        const scoreReadout = document.getElementById('score-readout');
        const streakReadout = document.getElementById('streak-count');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');

        const DIFFICULTIES = {
            easy:   { threshold: 230, speed: 2.5, cooldown: 450 },
            normal: { threshold: 185, speed: 6.0, cooldown: 180 },
            hard:   { threshold: 160, speed: 9.0, cooldown: 120 }
        };

        let currentDiff = DIFFICULTIES.easy;
        const LANES = [80, 200, 320];
        const PLAYER_Y = 440;
        
        let gameState = 'MENU';
        let score = 0, streak = 0, maxStreak = 0;
        let blocks = [], particles = [], judgments = [];
        let playerLane = 1;
        
        let audioCtx, analyser, dataArray, source, startTime, duration = 0, pausedAt = 0;
        let decodedBuffer = null;
        let lastSpawn = 0, hitGlow = 0, shakeIntensity = 0;
        let feverMode = false;

        function setDifficulty(level) {
            currentDiff = DIFFICULTIES[level];
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            if(window.event) window.event.target.classList.add('active');
        }

        function showMenu() {
            gameState = 'MENU';
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="menu-title">SYNC_CORE.v18</div>
                <button id="play-btn" class="menu-btn" ${!decodedBuffer ? 'disabled' : ''} onclick="startPlay()">PLAY_SESSION</button>
                <button class="menu-btn" onclick="showStats()">TRACK_DATA</button>
            `;
            statusText.innerText = decodedBuffer ? "READY_TO_START" : "WAITING_FOR_DATA";
        }

        function showPause() {
            if (gameState !== 'GAME') return;
            gameState = 'PAUSED';
            pausedAt = audioCtx.currentTime - startTime;
            if (source) {
                source.stop();
                source = null;
            }
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="menu-title" style="color:#fff">SYSTEM_PAUSE</div>
                <button class="menu-btn" onclick="resumePlay()">RESUME</button>
                <button class="menu-btn" onclick="showMenu()">QUIT</button>
            `;
            statusText.innerText = "SIGNAL_PAUSED";
        }

        function showStats() {
            gameState = 'STATS';
            overlay.innerHTML = `
                <div class="menu-title">SESSION_LOG</div>
                <div class="stat-line"><span class="stat-label">Last Score</span><span class="stat-val">${score}</span></div>
                <div class="stat-line"><span class="stat-label">Peak Streak</span><span class="stat-val">${maxStreak}</span></div>
                <div class="stat-line"><span class="stat-label">Difficulty</span><span class="stat-val">${Object.keys(DIFFICULTIES).find(key => DIFFICULTIES[key] === currentDiff).toUpperCase()}</span></div>
                <button class="menu-btn" style="margin-top:20px;" onclick="showMenu()">BACK</button>
            `;
        }

        function startPlay() {
            if (!decodedBuffer) return;
            score = 0; streak = 0; maxStreak = 0; blocks = []; particles = []; judgments = []; feverMode = false;
            scoreReadout.innerText = "0000";
            streakReadout.innerText = "00";
            runSession(0);
        }

        function resumePlay() {
            runSession(pausedAt);
        }

        function runSession(timeOffset) {
            gameState = 'GAME';
            overlay.style.display = 'none';
            statusText.innerText = "RUNNING";

            source = audioCtx.createBufferSource();
            source.buffer = decodedBuffer;
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            
            source.onended = () => { 
                if(gameState === 'GAME') {
                    gameState = 'STATS'; 
                    showStats(); 
                    overlay.style.display = 'flex';
                    statusText.innerText = "SESSION_END";
                }
            };

            source.start(0, timeOffset);
            startTime = audioCtx.currentTime - timeOffset;
            requestAnimationFrame(gameLoop);
        }

        audioUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            statusText.innerText = "DECODING...";
            if (audioCtx) audioCtx.close();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            const arrayBuffer = await file.arrayBuffer();
            decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            duration = decodedBuffer.duration;
            showMenu();
        });

        function handleInput(clientX, clientY) {
            if (gameState !== 'GAME') return;
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);
            if (y < 80) { showPause(); } 
            else {
                if (x < 133) playerLane = 0;
                else if (x < 266) playerLane = 1;
                else playerLane = 2;
            }
        }

        canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) handleInput(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (gameState !== 'GAME') return;
            if (e.key === 'ArrowLeft') playerLane = 0;
            if (e.key === 'ArrowDown' || e.key === 's') playerLane = 1;
            if (e.key === 'ArrowRight') playerLane = 2;
            if (e.key === 'Escape') showPause();
        });

        function spawnJudgment(text, color) {
            judgments.push({
                text: text,
                y: PLAYER_Y - 40,
                alpha: 1.0,
                color: color
            });
        }

        function spawnExplosion(x, y, color) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y, 
                    vx: (Math.random() - 0.5) * 12, 
                    vy: (Math.random() - 0.5) * 12 - 4,
                    life: 1.0, size: Math.random() * 4 + 2, color: color,
                    gravity: 0.2
                });
            }
        }

        function update() {
            if (gameState !== 'GAME') return;
            const elapsed = audioCtx.currentTime - startTime;
            const songProgress = Math.min((elapsed / duration), 1.0);
            progressFill.style.width = `${songProgress * 100}%`;
            
            analyser.getByteFrequencyData(dataArray);
            let energy = dataArray[2]; 
            
            let gravity = currentDiff.speed + (energy / 35) + (songProgress * 3);

            if (streak >= 25 && !feverMode) {
                feverMode = true;
                progressFill.classList.add('fever');
                statusText.innerText = "FEVER_ACTIVE";
            } else if (streak < 25 && feverMode) {
                feverMode = false;
                progressFill.classList.remove('fever');
                statusText.innerText = "RUNNING";
            }

            if (energy > currentDiff.threshold && Date.now() - lastSpawn > currentDiff.cooldown) {
                blocks.push({ lane: Math.floor(Math.random()*3), y: -30, missed: false });
                lastSpawn = Date.now();
            }

            blocks.forEach((b, i) => {
                b.y += gravity;
                if (b.y > PLAYER_Y - 25 && b.y < PLAYER_Y + 15 && b.lane === playerLane) {
                    const diff = Math.abs(b.y - PLAYER_Y);
                    let points = 10;
                    if (diff < 8) points = 20;

                    score += feverMode ? points * 2 : points;
                    streak++;
                    if (streak > maxStreak) maxStreak = streak;
                    
                    scoreReadout.innerText = score.toString().padStart(4, '0');
                    streakReadout.innerText = streak.toString().padStart(2, '0');
                    
                    hitGlow = 80; shakeIntensity = feverMode ? 25 : 15; 
                    
                    // Only spawn visual explosion, no "GREAT/PERFECT" text
                    spawnExplosion(LANES[playerLane], PLAYER_Y, feverMode ? 'var(--accent-fever)' : 'var(--accent-orange)');
                    blocks.splice(i, 1);
                } else if (b.y > PLAYER_Y + 25 && !b.missed) {
                    streak = 0;
                    streakReadout.innerText = "00";
                    b.missed = true;
                    feverMode = false;
                    spawnJudgment("MISS", "#444"); // Kept MISS for feedback
                }
                if (b.y > canvas.height) blocks.splice(i, 1);
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                p.vy += p.gravity;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            });

            judgments.forEach((j, i) => {
                j.y -= 1;
                j.alpha -= 0.03;
                if (j.alpha <= 0) judgments.splice(i, 1);
            });

            hitGlow *= 0.9;
            shakeIntensity *= 0.85;
        }

        function draw() {
            ctx.save();
            if (shakeIntensity > 0.1) ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
            
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (dataArray) {
                ctx.beginPath();
                ctx.strokeStyle = feverMode ? 'rgba(0, 242, 255, 0.12)' : 'rgba(255, 95, 0, 0.08)';
                ctx.lineWidth = 2;
                for(let i=0; i<dataArray.length; i++) {
                    let h = (dataArray[i] / 255) * 150;
                    ctx.moveTo(i * 4, canvas.height);
                    ctx.lineTo(i * 4, canvas.height - h);
                }
                ctx.stroke();
            }

            const activeLaneX = LANES[playerLane];
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
            gradient.addColorStop(0.8, feverMode ? 'rgba(0, 242, 255, 0.05)' : 'rgba(255, 95, 0, 0.03)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(activeLaneX - 45, 0, 90, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            for(let x=0; x<canvas.width; x+=25) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }

            blocks.forEach(b => {
                ctx.fillStyle = b.missed ? '#222' : '#fff';
                ctx.beginPath(); ctx.roundRect(LANES[b.lane]-25, b.y, 50, 10, 4); ctx.fill();
                if (!b.missed) {
                    ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color || `rgba(255, 95, 0, ${p.life})`;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            });

            judgments.forEach(j => {
                ctx.globalAlpha = j.alpha;
                ctx.fillStyle = j.color;
                ctx.font = 'bold 14px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(j.text, LANES[playerLane], j.y);
            });
            ctx.globalAlpha = 1.0;

            const pX = LANES[playerLane];
            const activeColor = feverMode ? '#00f2ff' : '#ff5f00';
            
            ctx.save();
            ctx.globalAlpha = 1.0; 
            ctx.shadowBlur = 0;    
            
            if (hitGlow > 0.5) { 
                ctx.shadowBlur = hitGlow; 
                ctx.shadowColor = activeColor; 
            }
            
            ctx.fillStyle = activeColor;
            ctx.beginPath(); 
            ctx.roundRect(pX-40, PLAYER_Y, 80, 18, 9); 
            ctx.fill();

            if (feverMode) {
                ctx.fillStyle = "#000";
                ctx.font = "bold 10px Inter";
                ctx.textAlign = "center";
                ctx.fillText("X2", pX, PLAYER_Y + 13);
            }

            ctx.restore(); 
            ctx.restore();
        }

        function gameLoop() {
            if (gameState === 'GAME') {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        showMenu();
        draw();
    </script>
</body>
</html>
